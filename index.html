<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="חומשי תורה" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- DNS prefetch and preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load only the primary fonts immediately; others load on demand via CSS -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet"></noscript>
    <!-- Secondary fonts: load after first paint -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Miriam+Libre:wght@400;700&family=Rubik:wght@400;700&family=Heebo:wght@400;700&family=Alef:wght@400;700&family=Varela+Round&display=swap" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Miriam+Libre:wght@400;700&family=Rubik:wght@400;700&family=Heebo:wght@400;700&family=Alef:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet"></noscript>
    <title>חמישה חומשי תורה - שאלות ופירושים</title>
    <meta name="description" content="ספריית חמישה חומשי תורה עם שאלות ופירושים של מפרשים מובילים. חפש ולמד עם חיפוש מתקדם." />
    <meta name="author" content="תורה ופירושים" />
    <meta name="keywords" content="תורה, חומש, פירושים, רש״י, רמב״ן, שאלות, תשובות" />

    <meta property="og:title" content="חמישה חומשי תורה - שאלות ופירושים" />
    <meta property="og:description" content="ספריית חמישה חומשי תורה עם שאלות ופירושים של מפרשים מובילים" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root">
      <!-- Instant splash: shown before React loads, hidden by React mount -->
      <div id="splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:hsl(40,20%,97%);font-family:'Frank Ruhl Libre',Georgia,serif;direction:rtl;">
        <div style="width:48px;height:48px;border:3px solid hsl(220,60%,20%);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;"></div>
        <p style="margin-top:16px;font-size:18px;color:hsl(220,40%,12%);">חמישה חומשי תורה</p>
        <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
